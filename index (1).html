<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Strategic Collaboration Matrix — Neo-Brutalist Analysis</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700;800&family=Space+Grotesk:wght@500;700;900&family=Syne:wght@700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #E8E3D9;
            --accent-volt: #CCFF00;
            --accent-cyan: #00E5FF;
            --accent-crimson: #FF3366;
            --accent-main: #CCFF00;
            --text-dark: #121212;
            --border-color: #000000;
        }

        .theme-cyan { --accent-main: var(--accent-cyan); }
        .theme-crimson { --accent-main: var(--accent-crimson); }
        .theme-mono { --accent-main: #FFFFFF; }
        .theme-volt { --accent-main: var(--accent-volt); }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-dark);
            font-family: 'Space Grotesk', sans-serif;
            min-height: 100vh;
            padding: 16px;
            position: relative;
            background-image: 
                radial-gradient(var(--border-color) 0.7px, transparent 0.7px),
                radial-gradient(var(--border-color) 0.7px, var(--bg-color) 0.7px);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            overflow-x: hidden;
        }

        .fold-crease-v {
            position: fixed;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 2px;
            background: linear-gradient(to right, rgba(0,0,0,0.15), rgba(255,255,255,0.4), rgba(0,0,0,0.15));
            pointer-events: none;
            z-index: 999;
        }

        .fold-crease-h {
            position: fixed;
            left: 0;
            right: 0;
            top: 38%;
            height: 2px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.15), rgba(255,255,255,0.4), rgba(0,0,0,0.15));
            pointer-events: none;
            z-index: 999;
        }

        .brutal-card {
            background: #FFFFFF;
            border: 4px solid var(--border-color);
            box-shadow: 6px 6px 0px var(--border-color);
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }

        .brutal-btn {
            background: #FFFFFF;
            border: 3px solid var(--border-color);
            box-shadow: 4px 4px 0px var(--border-color);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            text-transform: uppercase;
            padding: 10px 14px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            transition: all 0.1s ease;
        }

        .brutal-btn:hover, .brutal-btn:active {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--border-color);
            background: var(--accent-main);
        }

        .brutal-btn.active {
            background: var(--accent-main);
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px var(--border-color);
        }

        header {
            margin-bottom: 20px;
        }

        .top-meta {
            display: flex;
            flex-direction: column;
            gap: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            font-weight: 800;
            border-bottom: 3px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 12px;
        }

        .hero-title {
            font-family: 'Syne', sans-serif;
            font-size: clamp(1.8rem, 6vw, 3.5rem);
            font-weight: 900;
            line-height: 0.95;
            text-transform: uppercase;
            letter-spacing: -1px;
            margin-bottom: 12px;
        }

        .knockout-text {
            background: var(--border-color);
            color: var(--accent-volt);
            padding: 0 8px;
            display: inline-block;
        }

        .controls-bar {
            display: flex;
            flex-direction: column;
            gap: 12px;
            background: #FFFFFF;
            border: 4px solid var(--border-color);
            padding: 12px;
            box-shadow: 6px 6px 0px var(--border-color);
            margin-bottom: 20px;
        }

        .search-box {
            width: 100%;
        }

        .search-input {
            width: 100%;
            padding: 10px;
            border: 3px solid var(--border-color);
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 13px;
            outline: none;
            background: #FAF8F5;
        }

        .table-scroll-wrapper {
            width: 100%;
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
            border: 4px solid var(--border-color);
            box-shadow: 6px 6px 0px var(--border-color);
            background: #FFFFFF;
            margin-bottom: 24px;
        }

        .swiss-table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            min-width: 900px;
            table-layout: fixed;
        }

        .swiss-table th {
            background: var(--border-color);
            color: #FFFFFF;
            text-transform: uppercase;
            padding: 10px 8px;
            text-align: left;
            font-weight: 800;
            font-size: 10px;
            border-right: 2px solid #333;
            word-wrap: break-word;
            white-space: normal;
        }

        .swiss-table td {
            border: 2px solid var(--border-color);
            padding: 10px 8px;
            vertical-align: top;
            line-height: 1.35;
            word-wrap: break-word;
            overflow-wrap: anywhere;
            white-space: normal;
        }

        .swiss-table tr:nth-child(even) { background-color: #F8F6F0; }

        .col-id { width: 4%; text-align: center; }
        .col-discipline { width: 15%; font-weight: 800; font-family: 'Space Grotesk', sans-serif; font-size: 12px; }
        .col-theme { width: 13%; }
        .col-initiative { width: 20%; }
        .col-challenges { width: 18%; color: #990000; }
        .col-action { width: 15%; }
        .col-outcome { width: 15%; font-weight: 700; color: #004400; }

        .dossier-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 16px;
            margin-bottom: 24px;
        }

        @media (min-width: 600px) {
            .dossier-grid { grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); }
            .top-meta { flex-direction: row; justify-content: space-between; }
            .controls-bar { flex-direction: row; flex-wrap: wrap; }
        }

        .dossier-card {
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .dossier-card .card-head {
            border-bottom: 3px solid var(--border-color);
            padding-bottom: 8px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        .theme-tag {
            background: var(--accent-main);
            border: 2px solid var(--border-color);
            padding: 3px 6px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            display: inline-block;
        }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            padding: 16px;
        }

        .modal-overlay.active { display: flex; }

        .modal-body {
            max-width: 650px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            background: #FFFFFF;
            border: 4px solid var(--border-color);
            box-shadow: 8px 8px 0px var(--accent-main);
            padding: 20px;
        }

        .toast-notification {
            position: fixed;
            bottom: 16px;
            right: 16px;
            background: var(--accent-volt);
            border: 3px solid var(--border-color);
            box-shadow: 4px 4px 0px var(--border-color);
            padding: 10px 16px;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 800;
            font-size: 11px;
            z-index: 10000;
            transform: translateY(150%);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast-notification.show { transform: translateY(0); }

        .view-section { display: none; }
        .view-section.active { display: block; }
    </style>
</head>
<body class="theme-volt">

    <div class="fold-crease-v"></div>
    <div class="fold-crease-h"></div>

    <header>
        <div class="top-meta">
            <span>DOC REF: KKM-KPT/HOSP-STRAT/2026</span>
            <span>CONFIDENTIAL MATRIX / OFFICIAL USE ONLY</span>
        </div>
        <h1 class="hero-title">
            HOSPITAL COLLABORATION <span class="knockout-text">MATRIX</span>
        </h1>
    </header>

    <div class="controls-bar">
        <div class="search-box">
            <input type="text" id="searchInput" class="search-input" placeholder="SEARCH DISCIPLINE, INITIATIVE, GL, MRI, OT...">
        </div>
        
        <div style="display: flex; gap: 6px; flex-wrap: wrap;">
            <button class="brutal-btn active" onclick="switchView('grid')" id="btn-grid">📊 GRID VIEW</button>
            <button class="brutal-btn" onclick="switchView('dossier')" id="btn-dossier">🗂️ DOSSIER</button>
            <button class="brutal-btn" onclick="switchView('bottleneck')" id="btn-bottleneck">⚡ BOTTLENECKS</button>
        </div>

        <div style="display: flex; gap: 6px;">
            <button class="brutal-btn" style="padding: 6px 10px;" onclick="setTheme('volt')">⚡</button>
            <button class="brutal-btn" style="padding: 6px 10px;" onclick="setTheme('cyan')">💧</button>
            <button class="brutal-btn" style="padding: 6px 10px;" onclick="setTheme('crimson')">🔥</button>
            <button class="brutal-btn" style="padding: 6px 10px;" onclick="setTheme('mono')">⚪</button>
        </div>
    </div>

    <!-- VIEW 1: SWISS TECHNICAL GRID -->
    <section id="view-grid" class="view-section active">
        <div class="table-scroll-wrapper">
            <table class="swiss-table">
                <thead>
                    <tr>
                        <th class="col-id">#</th>
                        <th class="col-discipline">Discipline</th>
                        <th class="col-theme">Theme</th>
                        <th class="col-initiative">Proposed Initiative</th>
                        <th class="col-challenges">Challenges & Constraints</th>
                        <th class="col-action">Strategic Action Plan</th>
                        <th class="col-outcome">Potential Outcome (Inferred)</th>
                    </tr>
                </thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </section>

    <!-- VIEW 2: DOSSIER CARDS -->
    <section id="view-dossier" class="view-section">
        <div class="dossier-grid" id="dossierContainer"></div>
    </section>

    <!-- VIEW 3: BOTTLENECK FLOW -->
    <section id="view-bottleneck" class="view-section">
        <div id="bottleneckContainer" style="display: flex; flex-direction: column; gap: 12px;"></div>
    </section>

    <!-- MODAL POPUP -->
    <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
        <div class="modal-body brutal-card" onclick="event.stopPropagation()">
            <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 16px;">
                <h2 id="modalTitle" style="font-family: 'Syne', sans-serif; font-size: 22px; font-weight: 900; text-transform: uppercase;"></h2>
                <button class="brutal-btn" onclick="closeModalDirect()">✕ CLOSE</button>
            </div>
            <div id="modalContent" style="font-family: 'JetBrains Mono', monospace; font-size: 13px; line-height: 1.5;"></div>
        </div>
    </div>

    <!-- TOAST NOTIFICATION -->
    <div class="toast-notification" id="toast">ACTION LOGGED</div>

    <script>
        const dataset = [
            {
                id: 1,
                discipline: "Emergency and Trauma",
                theme: "Logistics and Decongestion",
                initiative: "Direct ambulance diversion of stable GL-holding patients and stroke cases to HSAAS/HPUA.",
                challenges: "Requirement for clear family consent and base medical command approval.",
                action: "Standardize ambulance protocols to bypass HTPN for specific stable stroke or GL cases.",
                outcome: "Significant reduction in Emergency Department overcrowding and faster definitive care for stroke patients.",
                source: "Draft Minit Mesyuarat HPUA HTPN"
            },
            {
                id: 2,
                discipline: "Internal Medicine",
                theme: "Outsourcing and Specialist Training",
                initiative: "Outsourcing bronchoscopy, sleep study, and NCS; establishing a stroke thrombolysis referral pathway to HPUPM; training for echocardiograms and point-of-care ultrasound.",
                challenges: "Lack of monitoring capacity (CCU/MICU) at HTPN; issues with deposit and legal governance.",
                action: "HOD to refine governance and funding models (e.g., trust funds) and identify stable MOPD patients for forced discharge/referral to HPUPM.",
                outcome: "Enhanced access to specialized diagnostic procedures and reduced congestion in HTPN medical wards.",
                source: "Draft Minit Mesyuarat HPUA HTPN"
            },
            {
                id: 3,
                discipline: "Surgery & Specializations",
                theme: "Facility Sharing and Specialist Support",
                initiative: "Referring complex Colorectal, Urology, and Vascular cases to HPUA; direct referral of cases (e.g., Paeds Orthopedic, IR, Plastic Surgery) to HPKK; hosting HPUPM surgical teams at HTPN.",
                challenges: "Maintaining continuity of care; shortage of 150 nursing staff at HPKK; requires Credentialing & Privileging (C&P) coordination across KKM and KPT.",
                action: "Coordinate C&P across ministries; utilize existing gazettement of HPUPM surgeons to facilitate collaborative surgeries; HODs to discuss direct referral pathways.",
                outcome: "Improved surgical outcomes for complex cases, reduced burden on HTPN surgeons, and better utilization of underused Operating Theaters at HPKK.",
                source: "Draft Minit Mesyuarat HPUA HTPN"
            },
            {
                id: 4,
                discipline: "Diagnostics, Imaging & Lab",
                theme: "Paid Outsourcing & Facility Sharing",
                initiative: "Collaborate with HPUA for Interventional Radiology (IR) services; refer patients to HPKK for CT Scans, MRI, or laboratory tests.",
                challenges: "High cost of consumables; MRI waiting time at HPUPM is 6+ months; HPKK services are fee-based; HTPN lacks MRI facilities.",
                action: "Management to resolve financing; identify T20 or GL patients for HPKK referral; utilize JKSP for B40 financial aid; HOD to finalize GL list for HPUPM referral.",
                outcome: "Faster diagnostic turnaround, restoration of critical IR services, and reduced surgical waiting lists by optimizing trauma OTs.",
                source: "Draft Minit Mesyuarat HPUA HTPN"
            },
            {
                id: 5,
                discipline: "Orthopedics",
                theme: "Facility Sharing & Support",
                initiative: "Referring surgical patients with GLs to HPUPM; inviting HPUA specialists for sports and spine sub-specialty surgeries at HTPN.",
                challenges: "MRI waiting time at HPUPM is longer (6+ months) than HTPN (3 months).",
                action: "HOD to finalize list of GL patients for referral to optimize HTPN operating theater (OT) for trauma cases.",
                outcome: "Reduced surgical waiting lists for elective orthopedic procedures and better utilization of HTPN trauma OTs.",
                source: "Draft Minit Mesyuarat HPUA HTPN"
            },
            {
                id: 6,
                discipline: "Child Development Centre (CDC)",
                theme: "Clinical Attachment & Case Screening",
                initiative: "Send HTPN pediatricians for clinical attachment programs at HPKK; only complex cases to be referred to HPKK.",
                challenges: "HPKK waiting list for new cases exceeds one year; simple cases should remain at HTPN.",
                action: "Initiate non-NSR clinical attachment for HTPN pediatricians; implement screening protocols to filter complex vs simple cases.",
                outcome: "Improved clinical skills for HTPN staff and decongestion of HPKK's specialist clinics by filtering simple cases.",
                source: "Rumusan Lawatan HPKK"
            },
            {
                id: 7,
                discipline: "Pediatric Surgery",
                theme: "Outsourcing & Facility Sharing",
                initiative: "Alternative referral for complex cases, neonates, pediatric oncology, and pediatric burns/neuro-pediatrics.",
                challenges: "Limited existing referral alternatives for pediatric specialty surgeries.",
                action: "HOD to list specific complex pediatric service requirements for the official wish list.",
                outcome: "Access to specialized pediatric surgical care and decongestion of neonatal intensive care units.",
                source: "Draft Minit Mesyuarat HPUA HTPN"
            },
            {
                id: 8,
                discipline: "Obstetrics & Gynecology (O&G)",
                theme: "Outsourcing",
                initiative: "Referral of Maternal Fetal Medicine (MFM) cases at 28-30 weeks of pregnancy to HPUPM.",
                challenges: "Timing of referrals to ensure effective management of high-risk pregnancies.",
                action: "Establish referral protocols for early-stage high-risk pregnancies.",
                outcome: "Better management of high-risk pregnancies and reduced burden on HTPN maternity wards.",
                source: "Draft Minit Mesyuarat HPUA HTPN"
            },
            {
                id: 9,
                discipline: "Psychiatry & Mental Health",
                theme: "Facility Sharing & Referrals",
                initiative: "Voluntary admission for pediatric patients; referral of older children (7-8+ years) with behavioral problems/ASD to HPKK; sharing assessment tools.",
                challenges: "HPUPM/HPKK wards are not gazetted under Mental Health Act; lack of dedicated child psychiatric wards; high cost of assessment tools.",
                action: "Focus collaboration on voluntary pediatric cases; refer psychiatric admissions to HUKM; coordinate ASD assessments based on HPKK capacity.",
                outcome: "Expanded psychiatric evaluation capabilities and structured mental health support for pediatric patients.",
                source: "Draft Minit Mesyuarat HPUA HTPN"
            },
            {
                id: 10,
                discipline: "Rehabilitation & Physio",
                theme: "Facility Sharing",
                initiative: "Utilizing HPUPM/HPKK's larger sensory rooms and Visiting Play Specialist services for pediatric rehabilitation.",
                challenges: "Logistics of moving patients; severe staff shortage (HTPN has 1 Speech Therapist; HPKK waiting list is 6 months).",
                action: "Target pediatric rehab patients for referral; conduct specific follow-up discussions with HPKK Rehab Unit to establish access protocols.",
                outcome: "Improved therapeutic outcomes for children through access to superior sensory equipment and specialist services.",
                source: "Draft Minit Mesyuarat HPUA HTPN"
            },
            {
                id: 11,
                discipline: "Forensic Medicine",
                theme: "Training & Human Resource Sharing",
                initiative: "Designating HTPN as an official post-mortem training center for UPM students.",
                challenges: "UPM laboratory (HSAAS) closure; need for teaching equipment like microscopes at HTPN.",
                action: "HSAAS to provide teaching equipment while HTPN provides forensic case exposure for UPM medical officers.",
                outcome: "Increased manpower for HTPN forensic department and improved training for UPM students.",
                source: "Draft Minit Mesyuarat HPUA HTPN"
            }
        ];

        function renderTable(data) {
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = data.map(item => `
                <tr>
                    <td class="col-id" style="font-weight:800;">${item.id}</td>
                    <td class="col-discipline">${item.discipline}</td>
                    <td class="col-theme"><span class="theme-tag">${item.theme}</span></td>
                    <td class="col-initiative">${item.initiative}</td>
                    <td class="col-challenges"><strong>⚠️ BOTTLENECK:</strong><br>${item.challenges}</td>
                    <td class="col-action">${item.action}</td>
                    <td class="col-outcome">${item.outcome}</td>
                </tr>
            `).join('');
        }

        function renderDossier(data) {
            const container = document.getElementById('dossierContainer');
            container.innerHTML = data.map(item => `
                <div class="dossier-card brutal-card">
                    <div>
                        <div class="card-head">
                            <span class="theme-tag">${item.theme}</span>
                            <span style="font-family:'JetBrains Mono'; font-size:11px; font-weight:800;">#0${item.id}</span>
                        </div>
                        <h3 style="font-family:'Syne',sans-serif; font-size:18px; font-weight:800; text-transform:uppercase; margin-bottom:8px;">${item.discipline}</h3>
                        <p style="font-size:12px; line-height:1.4; margin-bottom:8px;"><strong>Initiative:</strong> ${item.initiative}</p>
                        <p style="font-size:11px; color:#AA0000; background:#FFF0F0; padding:6px; border:2px solid #000; margin-bottom:8px;"><strong>Constraint:</strong> ${item.challenges}</p>
                    </div>
                    <button class="brutal-btn" style="width:100%; justify-content:center; margin-top:6px;" onclick="openModal(${item.id})">🔍 VIEW DOSSIER</button>
                </div>
            `).join('');
        }

        function renderBottlenecks(data) {
            const container = document.getElementById('bottleneckContainer');
            container.innerHTML = data.map(item => `
                <div class="brutal-card" style="padding:12px; display:flex; flex-direction:column; gap:8px;">
                    <div style="background:#000; color:#FFF; padding:8px; font-weight:800; font-family:'Syne'; font-size:14px;">
                        <span style="font-size:10px; color:var(--accent-volt); display:block;">DISCIPLINE #${item.id}</span>
                        ${item.discipline}
                    </div>
                    <div style="border-left:4px solid var(--accent-crimson); padding-left:10px;">
                        <span style="font-size:10px; font-weight:800; color:var(--accent-crimson);">CRITICAL CHALLENGE</span>
                        <div style="font-size:12px; font-weight:700;">${item.challenges}</div>
                    </div>
                    <div style="border-left:4px solid var(--accent-volt); padding-left:10px;">
                        <span style="font-size:10px; font-weight:800; color:#006600;">ACTION PLAN & OUTCOME</span>
                        <div style="font-size:12px;">${item.action}</div>
                    </div>
                </div>
            `).join('');
        }

        function switchView(viewName) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.controls-bar .brutal-btn').forEach(el => el.classList.remove('active'));

            document.getElementById(`view-${viewName}`).classList.add('active');
            document.getElementById(`btn-${viewName}`).classList.add('active');

            showToast(`VIEW: ${viewName.toUpperCase()}`);
        }

        function openModal(id) {
            const item = dataset.find(d => d.id === id);
            if (!item) return;

            document.getElementById('modalTitle').innerText = item.discipline;
            document.getElementById('modalContent').innerHTML = `
                <p style="margin-bottom:10px;"><strong>COLLABORATION THEME:</strong><br><span class="theme-tag">${item.theme}</span></p>
                <p style="margin-bottom:10px;"><strong>PROPOSED INITIATIVE:</strong><br>${item.initiative}</p>
                <p style="margin-bottom:10px; color:#BB0000; background:#FFF0F0; padding:8px; border:2px solid #000;"><strong>CHALLENGES & CONSTRAINTS:</strong><br>${item.challenges}</p>
                <p style="margin-bottom:10px;"><strong>STRATEGIC ACTION PLAN:</strong><br>${item.action}</p>
                <p style="margin-bottom:10px; background:#F0FFF0; padding:8px; border:2px solid #000;"><strong>POTENTIAL OUTCOME:</strong><br>${item.outcome}</p>
                <p style="margin-bottom:4px; font-size:10px; opacity:0.8;"><strong>SOURCE REFERENCE:</strong> ${item.source}</p>
            `;
            document.getElementById('modalOverlay').classList.add('active');
        }

        function closeModal(event) {
            if (event.target === document.getElementById('modalOverlay')) {
                document.getElementById('modalOverlay').classList.remove('active');
            }
        }

        function closeModalDirect() {
            document.getElementById('modalOverlay').classList.remove('active');
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function setTheme(theme) {
            document.body.className = `theme-${theme}`;
            showToast(`THEME: ${theme.toUpperCase()}`);
        }

        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = dataset.filter(d => 
                d.discipline.toLowerCase().includes(term) ||
                d.theme.toLowerCase().includes(term) ||
                d.initiative.toLowerCase().includes(term) ||
                d.challenges.toLowerCase().includes(term) ||
                d.action.toLowerCase().includes(term) ||
                d.outcome.toLowerCase().includes(term)
            );
            renderTable(filtered);
            renderDossier(filtered);
            renderBottlenecks(filtered);
        });

        renderTable(dataset);
        renderDossier(dataset);
        renderBottlenecks(dataset);
    </script>
</body>
